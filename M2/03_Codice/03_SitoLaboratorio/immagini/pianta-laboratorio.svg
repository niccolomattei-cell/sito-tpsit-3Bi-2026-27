<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Pianta dell'aula 214: la cattedra e quattro file da sei postazioni</title>

  <!-- Perimetro dell'aula -->
  <rect x="10" y="10" width="460" height="300" fill="#ffffff" stroke="#333333" stroke-width="3"/>

  <!-- Porta di ingresso: interruzione della parete di sinistra -->
  <rect x="7" y="240" width="6" height="56" fill="#ffffff"/>
  <path d="M 13 296 A 56 56 0 0 0 69 240" fill="none" stroke="#999999" stroke-width="2"/>

  <!-- Cattedra -->
  <rect x="180" y="28" width="120" height="34" fill="#dddddd" stroke="#333333" stroke-width="2"/>

  <!-- Prima fila -->
  <rect x="30" y="95" width="50" height="30" fill="#f2f2f2" stroke="#555555" stroke-width="2"/>
  <rect x="100" y="95" width="50" height="30" fill="#f2f2f2" stroke="#555555" stroke-width="2"/>
  <rect x="170" y="95" width="50" height="30" fill="#f2f2f2" stroke="#555555" stroke-width="2"/>
  <rect x="240" y="95" width="50" height="30" fill="#f2f2f2" stroke="#555555" stroke-width="2"/>
  <rect x="310" y="95" width="50" height="30" fill="#f2f2f2" stroke="#555555" stroke-width="2"/>
  <rect x="380" y="95" width="50" height="30" fill="#f2f2f2" stroke="#555555" stroke-width="2"/>

  <!-- Seconda fila -->
  <rect x="30" y="150" width="50" height="30" fill="#f2f2f2" stroke="#555555" stroke-width="2"/>
  <rect x="100" y="150" width="50" height="30" fill="#f2f2f2" stroke="#555555" stroke-width="2"/>
  <rect x="170" y="150" width="50" height="30" fill="#f2f2f2" stroke="#555555" stroke-width="2"/>
  <rect x="240" y="150" width="50" height="30" fill="#f2f2f2" stroke="#555555" stroke-width="2"/>
  <rect x="310" y="150" width="50" height="30" fill="#f2f2f2" stroke="#555555" stroke-width="2"/>
  <rect x="380" y="150" width="50" height="30" fill="#f2f2f2" stroke="#555555" stroke-width="2"/>

  <!-- Terza fila -->
  <rect x="30" y="205" width="50" height="30" fill="#f2f2f2" stroke="#555555" stroke-width="2"/>
  <rect x="100" y="205" width="50" height="30" fill="#f2f2f2" stroke="#555555" stroke-width="2"/>
  <rect x="170" y="205" width="50" height="30" fill="#f2f2f2" stroke="#555555" stroke-width="2"/>
  <rect x="240" y="205" width="50" height="30" fill="#f2f2f2" stroke="#555555" stroke-width="2"/>
  <rect x="310" y="205" width="50" height="30" fill="#f2f2f2" stroke="#555555" stroke-width="2"/>
  <rect x="380" y="205" width="50" height="30" fill="#f2f2f2" stroke="#555555" stroke-width="2"/>

  <!-- Quarta fila -->
  <rect x="30" y="260" width="50" height="30" fill="#f2f2f2" stroke="#555555" stroke-width="2"/>
  <rect x="100" y="260" width="50" height="30" fill="#f2f2f2" stroke="#555555" stroke-width="2"/>
  <rect x="170" y="260" width="50" height="30" fill="#f2f2f2" stroke="#555555" stroke-width="2"/>
  <rect x="240" y="260" width="50" height="30" fill="#f2f2f2" stroke="#555555" stroke-width="2"/>
  <rect x="310" y="260" width="50" height="30" fill="#f2f2f2" stroke="#555555" stroke-width="2"/>
  <rect x="380" y="260" width="50" height="30" fill="#f2f2f2" stroke="#555555" stroke-width="2"/>

  <!-- Armadio della strumentazione, parete di destra -->
  <rect x="440" y="28" width="26" height="60" fill="#dddddd" stroke="#333333" stroke-width="2"/>
</svg>
